<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Menu of Coffee House Resource: coffee, tea and desserts.">
    <title>Menu — Coffee House</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;1,600&display=swap"
    >
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="js/theme.js"></script>
    <script type="module" src="js/burger.js"></script>
    <script type="module" src="js/catalog.js"></script>
  </head>
  <body>
    <header class="header">
      <div class="container header__inner">
        <a class="logo" href="index.html">
          <img class="logo__image logo__image--light" src="assets/icons/logo.svg" width="100" height="60" alt="Resource Coffee House">
          <img class="logo__image logo__image--dark" src="assets/icons/logo-dark.svg" width="100" height="60" alt="Resource Coffee House">
        </a>
        <nav class="nav" id="nav" aria-label="Main navigation">
          <ul class="nav__list">
            <li><a class="link" href="index.html#favorite-coffee">Favorite coffee</a></li>
            <li><a class="link" href="index.html#about">About</a></li>
            <li><a class="link" href="index.html#mobile-app">Mobile app</a></li>
            <li><a class="link" href="#contacts">Contact us</a></li>
          </ul>
          <ul class="nav__catalog">
            <li><a class="link" href="menu.html" aria-current="page">Menu <span class="icon icon--coffee-cup" aria-hidden="true"></span></a></li>
          </ul>
        </nav>
        <label class="theme-switch header__theme-switch">
          <input class="theme-switch__input visually-hidden" id="theme-toggle" type="checkbox" role="switch" aria-label="Dark theme">
          <span class="theme-switch__option theme-switch__option--light"><span class="icon icon--sun" aria-hidden="true"></span></span>
          <span class="theme-switch__option theme-switch__option--dark"><span class="icon icon--moon" aria-hidden="true"></span></span>
        </label>
        <button class="burger-button header__burger" type="button" aria-label="Open menu" aria-controls="nav" aria-expanded="false">
          <span class="icon icon--burger" aria-hidden="true"></span>
          <span class="icon icon--close" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main class="main">
      <section class="menu">
        <div class="container">
          <div class="menu__offer">
            <h1 class="menu__title">Behind each of our cups hides an <span class="accent">amazing surprise</span></h1>
            <div class="menu__tabs">
              <button class="tab tab--active" type="button" aria-pressed="true" data-category="coffee">
                <span class="tab__icon" aria-hidden="true">☕</span>Coffee
              </button>
              <button class="tab" type="button" aria-pressed="false" data-category="tea">
                <span class="tab__icon" aria-hidden="true">🫖</span>Tea
              </button>
              <button class="tab" type="button" aria-pressed="false" data-category="dessert">
                <span class="tab__icon" aria-hidden="true">🍰</span>Dessert
              </button>
            </div>
          </div>
          <ul class="menu__grid"></ul>
          <template id="card-template">
            <li class="menu__item">
              <article class="card" tabindex="0">
                <div class="card__image-box">
                  <img class="card__image" width="340" height="340" alt="">
                </div>
                <div class="card__body">
                  <div class="card__info">
                    <h2 class="card__title"></h2>
                    <p class="card__description"></p>
                  </div>
                  <p class="card__price"></p>
                </div>
              </article>
            </li>
          </template>
          <button class="icon-button menu__more" type="button" aria-label="Load more">
            <span class="icon icon--refresh" aria-hidden="true"></span>
          </button>
        </div>
      </section>
    </main>

    <footer class="footer" id="contacts">
      <div class="container">
        <div class="footer__inner">
          <div class="footer__offer">
            <h2 class="footer__title">Sip, Savor, Smile. <span class="accent">It’s coffee time!</span></h2>
            <ul class="footer__socials">
              <li>
                <a class="social-link" href="https://x.com" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
                  <span class="icon icon--twitter" aria-hidden="true"></span>
                </a>
              </li>
              <li>
                <a class="social-link" href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                  <span class="icon icon--instagram" aria-hidden="true"></span>
                </a>
              </li>
              <li>
                <a class="social-link" href="https://www.facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                  <span class="icon icon--facebook" aria-hidden="true"></span>
                </a>
              </li>
            </ul>
          </div>
          <div class="footer__contacts">
            <h3 class="footer__subtitle">Contact us</h3>
            <address class="footer__address">
              <ul class="footer__contacts-list">
                <li>
                  <a class="link" href="https://www.google.com/maps/search/?api=1&amp;query=8558+Green+Rd.,+Los+Angeles" target="_blank" rel="noopener noreferrer">
                    <span class="icon icon--pin" aria-hidden="true"></span>8558 Green Rd., LA
                  </a>
                </li>
                <li>
                  <a class="link" href="tel:+16035550123"><span class="icon icon--phone" aria-hidden="true"></span>+1 (603) 555-0123</a>
                </li>
                <li>
                  <span class="link footer__hours"><span class="icon icon--clock" aria-hidden="true"></span>Mon–Sat: 9:00–23:00</span>
                </li>
              </ul>
            </address>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
